name: AgentRaaS MCP safety scan
description: Fail the build when an MCP server in your config has a tool that can move money, delete data, run code or send messages.
branding: { icon: shield, color: orange }
inputs:
  config:
    description: MCP config file(s) with mcpServers, space-separated. Ignored when command is set.
    default: .mcp.json
  command:
    description: Scan this one server command instead of a config, e.g. "npx -y @modelcontextprotocol/server-github".
    default: ""
  fail-on:
    description: high, medium, or none (report only)
    default: high
  timeout:
    description: Seconds to wait for each server to answer
    default: "120"
  version:
    description: agentraas package version
    default: ">=0.12.0"
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install --quiet "agentraas${{ inputs.version }}"
    - shell: bash
      env:
        SCAN_CONFIG: ${{ inputs.config }}
        SCAN_COMMAND: ${{ inputs.command }}
        SCAN_FAIL_ON: ${{ inputs.fail-on }}
        SCAN_TIMEOUT: ${{ inputs.timeout }}
      run: |
        args=(--timeout "$SCAN_TIMEOUT")
        [ "$SCAN_FAIL_ON" != none ] && args+=(--fail-on "$SCAN_FAIL_ON")
        if [ -n "$SCAN_COMMAND" ]; then
          read -ra cmd <<< "$SCAN_COMMAND"; args+=(-- "${cmd[@]}")
        else
          for c in $SCAN_CONFIG; do args=(--config "$c" "${args[@]}"); done
        fi
        set +e
        agentraas scan "${args[@]}" | tee scan-output.txt
        code=${PIPESTATUS[0]}
        { echo '### MCP safety scan'; echo '```'; cat scan-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        rm -f scan-output.txt
        exit "$code"
